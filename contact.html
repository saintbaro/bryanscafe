    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        function submitForm(event) {
            event.preventDefault();
            alert('Message has been sent!');

            document.getElementById("enquiryForm").reset();

            return false;
        }
        // Fetch Branch Data from branches.xml
        fetch('xml/branches.xml')
            .then(response => response.text())
            .then(data => {
                let xmlDoc = new DOMParser().parseFromString(data, "text/xml");
                let branches = xmlDoc.getElementsByTagName("branch");
                let output = "";
                for (let i = 0; i < branches.length; i++) {
                    output += `
                        <div class="branch-card">
                            <p><strong>Address:</strong> ${branches[i].getElementsByTagName("address")[0].textContent}</p>
                            <p><strong>Contact:</strong> ${branches[i].getElementsByTagName("phone")[0].textContent}</p>
                            <p><strong>Hours:</strong> ${branches[i].getElementsByTagName("hours")[0].textContent}</p>
                            <a href="${branches[i].getElementsByTagName("maplink")[0].textContent}" target="_blank">View on Google Maps</a>
                        </div><hr>`;
                }
                document.getElementById("branch-list").innerHTML = output;
            });
    </script>
